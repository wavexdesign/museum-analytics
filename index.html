<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场馆运营数据分析系统</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface2: #F0EDE6;
  --border: rgba(60,50,30,0.12);
  --border2: rgba(60,50,30,0.22);
  --text: #1C1A14;
  --text2: #6B6456;
  --text3: #9E9688;
  --accent: #3D5A3E;
  --accent-light: #EAF0EA;
  --accent2: #8B4513;
  --accent2-light: #FAF0E6;
  --red: #C0392B;
  --red-light: #FDEDEB;
  --gold: #B8860B;
  --gold-light: #FDF8E1;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* Header */
.header {
  background: var(--text);
  color: #F7F5F0;
  padding: 0 2rem;
  display: flex;
  align-items: center;

  height: 60px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.header-sub {
  font-size: 11px;
  color: rgba(247,245,240,0.5);
  letter-spacing: 0.08em;
  margin-top: 1px;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
  justify-content: flex-end;
}

/* Layout */
.container { max-width: 1300px; margin: 0 auto; padding: 2rem 1.5rem; }

/* Summary cards */
/* summary-grid replaced by summary-grid-inner */
.scard {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.25rem 1rem;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: transform 0.15s;
}
.scard:hover { transform: translateY(-2px); }
.scard-icon { font-size: 22px; margin-bottom: 8px; }
.scard-label { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.scard-val { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--text); }
.scard-unit { font-size: 12px; color: var(--text3); margin-left: 2px; }

/* Toolbar */
.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  box-shadow: var(--shadow);
}
.toolbar-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; }
.toolbar label { font-size: 12px; color: var(--text2); white-space: nowrap; }
select, input[type="month"], input[type="text"], input[type="number"], input[type="date"], textarea {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  padding: 7px 12px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  transition: border-color 0.15s, box-shadow 0.15s;
  height: 36px;
}
select:focus, input:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(61,90,62,0.1);
}

/* Buttons */
.btn {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  padding: 7px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface2); border-color: var(--border2); }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 500;
}
.btn-primary:hover { background: #2d4a2e; border-color: #2d4a2e; }
.btn-danger { color: var(--red); border-color: transparent; padding: 4px 8px; height: auto; font-size: 12px; }
.btn-danger:hover { background: var(--red-light); }
.btn-export { color: var(--gold); border-color: var(--gold); }
.btn-export:hover { background: var(--gold-light); }
.btn-edit { color: var(--accent); border-color: transparent; padding: 4px 8px; height: auto; font-size: 13px; }
.btn-edit:hover { background: var(--accent-light); }

/* Table */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.table-header {
  display: flex;
  align-items: center;

  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.table-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.record-count {
  font-size: 12px;
  color: var(--text3);
  background: var(--surface2);
  padding: 2px 10px;
  border-radius: 20px;
}
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
thead th {
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: left;
  padding: 10px 14px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text2); }
thead th .sort-icon { margin-left: 4px; opacity: 0.4; }
tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.1s; }
tbody tr:hover td { background: rgba(61,90,62,0.04); }

/* Tags */
.tag {
  display: inline-block;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.mono { font-family: 'DM Mono', monospace; font-size: 13px; }
.gift-text { font-size: 12px; color: var(--text2); max-width: 180px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 3rem 2rem;
  color: var(--text3);
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* Modal */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(28,26,20,0.4);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(2px);
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 2rem;
  width: 500px;
  max-width: 100%;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { transform: translateY(12px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%;
  background: var(--bg);
}
.form-row textarea { height: 72px; resize: vertical; line-height: 1.6; }
.form-row .hint { font-size: 11px; color: var(--text3); margin-top: 3px; }
.modal-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 1.5rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--text);
  color: #F7F5F0;
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  box-shadow: var(--shadow-lg);
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s ease;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
.tab {
  padding: 10px 20px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text2);
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-weight: 500;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Chart area */
.chart-section { display: none; }
.chart-section.active { display: block; }
.data-section { display: none; }
.data-section.active { display: block; }
.chart-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 1.5rem; }
.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  box-shadow: var(--shadow);
}
.chart-card-title { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 1rem; }
canvas { width: 100% !important; }

@media (max-width: 700px) {
  .container { padding: 1rem; }
  .header { padding: 0 1rem; }
  .form-grid { grid-template-columns: 1fr; }
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .header-sub { display: none; }
}

/* Login overlay */
.login-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(28,26,20,0.55);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(3px);
}
.login-overlay.open { display: flex; }
.login-box {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 2.2rem 2rem 1.8rem;
  width: 360px;
  max-width: 100%;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.2s ease;
}
.login-logo { font-size: 28px; text-align: center; margin-bottom: 6px; }
.login-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 4px;
}
.login-sub { font-size: 12px; color: var(--text3); text-align: center; margin-bottom: 1.6rem; }
.login-err { font-size: 12px; color: var(--red); background: var(--red-light); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 12px; display: none; }
.login-err.show { display: block; }
.login-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.4rem; }

/* Header user state */
.user-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: rgba(247,245,240,0.85);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 4px 14px 4px 10px;
  cursor: default;
}
.user-chip .avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff;
}
.btn-logout {
  font-size: 12px;
  color: rgba(247,245,240,0.6);
  border: 1px solid rgba(255,255,255,0.2);
  background: transparent;
  border-radius: var(--radius);
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-logout:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
.btn-login-header {
  font-size: 13px;
  color: rgba(247,245,240,0.75);
  border: 1px solid rgba(255,255,255,0.25);
  background: transparent;
  border-radius: var(--radius);
  padding: 5px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-login-header:hover { color: #fff; border-color: rgba(255,255,255,0.6); }


/* Latest day card */
.summary-grid-inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 1rem; }
.latest-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
}
.latest-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.latest-date {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text3);
  font-weight: 400;
}
.latest-grid { display: flex; gap: 12px; flex-wrap: wrap; }
.latest-item {
  border-radius: var(--radius);
  padding: 12px 16px;
  flex: 1;
  min-width: 200px;
}
.latest-item-header {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;

}
.latest-item-date {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  font-weight: 400;
}
.latest-stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.latest-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 56px;
}
.latest-stat-label {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.04em;
}
.latest-stat-val {
  font-family: 'DM Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
}
.latest-stat-unit {
  font-size: 11px;
  color: var(--text3);
  margin-left: 2px;
  font-weight: 400;
}

</style>
</head>
<body>

<header class="header">
  <div>
    <div class="header-title">场馆运营数据分析系统</div>
    <div class="header-sub">VENUE OPERATIONS ANALYTICS</div>
  </div>
  <div class="header-right" id="headerRight">
    <button class="btn-login-header" onclick="requireLogin(null)">登录</button>
  </div>
</header>

<div class="container">

  <!-- Summary Cards -->
  <div id="summaryCards"></div>

  <!-- 筛选栏：始终显示 -->
  <div class="toolbar">
    <div class="toolbar-group">
      <label>项目</label>
      <select id="filterProject" onchange="renderTable()">
        <option value="">全部项目</option>
      </select>
      <label>从</label>
      <input type="date" id="filterDateFrom" onchange="renderTable()" title="开始日期">
      <label>到</label>
      <input type="date" id="filterDateTo" onchange="renderTable()" title="结束日期">
      <button class="btn" onclick="clearFilters()">重置</button>
    </div>
    <button class="btn btn-primary" id="addBtn" onclick="requireLogin(null)" style="white-space:nowrap">＋ 添加数据</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('data')">📋 数据记录</div>
    <div class="tab" onclick="switchTab('chart')">📊 趋势图表</div>
  </div>

  <!-- Data Section -->
  <div class="data-section active" id="dataSection">

    <!-- Table -->
    <div class="table-wrap">
      <div class="table-header">
        <div>
          <span class="table-title">每日运营记录</span>
        </div>
        <span class="record-count" id="recordCount">0 条记录</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>项目</th>
              <th class="sortable" onclick="sortBy('date')">日期 <span class="sort-icon" id="sort-date">↕</span></th>
              <th class="sortable" onclick="sortBy('sales')">销售额 (元) <span class="sort-icon" id="sort-sales">↕</span></th>
              <th class="sortable" onclick="sortBy('orders')">订单量 <span class="sort-icon" id="sort-orders">↕</span></th>
              <th class="sortable" onclick="sortBy('flow')">客流量 <span class="sort-icon" id="sort-flow">↕</span></th>
              <th>转化率</th>
              <th>分享文章数</th>
              <th>礼物</th>
              <th id="thAction" style="width:50px"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none">
          <div class="empty-icon">📭</div>
          <p>暂无数据，点击右上角"＋ 添加数据"开始记录</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart Section -->
  <div class="chart-section" id="chartSection">
    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-card-title">销售额趋势</div>
        <div style="position:relative;height:300px"><canvas id="chartSales" role="img" aria-label="各项目销售额趋势图">销售额趋势图</canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">客流量趋势</div>
        <div style="position:relative;height:300px"><canvas id="chartFlow" role="img" aria-label="各项目客流量趋势图">客流量趋势图</canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">订单量趋势</div>
        <div style="position:relative;height:300px"><canvas id="chartOrders" role="img" aria-label="各项目订单量趋势图">订单量趋势图</canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">转化率趋势 (%)</div>
        <div style="position:relative;height:300px"><canvas id="chartConvert" role="img" aria-label="各项目转化率趋势图">转化率趋势图</canvas></div>
      </div>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">＋ 添加每日数据</div>
    <div class="form-row">
      <label>项目名称 *</label>
      <input type="text" id="fProject" list="projectList" placeholder="如：科技馆、博物馆…">
      <datalist id="projectList"></datalist>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>日期 *</label>
        <input type="date" id="fDate">
      </div>
      <div class="form-row">
        <label>进馆客流量 *</label>
        <input type="number" id="fFlow" placeholder="如：634" min="0">
      </div>
      <div class="form-row">
        <label>今日销售额 (元) *</label>
        <input type="number" id="fSales" placeholder="如：295" min="0" step="0.1">
      </div>
      <div class="form-row">
        <label>今日订单量 *</label>
        <input type="number" id="fOrders" placeholder="如：5" min="0">
      </div>
      <div class="form-row">
        <label>转化率（自动计算）</label>
        <div id="convertPreview" style="height:36px;display:flex;align-items:center;padding:0 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);font-family:'DM Mono',monospace;font-size:13px;color:var(--text2);">— 请先填写订单量和客流量</div>
      </div>
    </div>
    <div class="form-row">
      <label>分享文章数</label>
      <textarea id="fShare" placeholder="每行一条渠道及数量，如：&#10;微信公众号=8&#10;抖音=3" style="height:80px"></textarea>
      <div class="hint">格式：渠道名称=数量，每行一条</div>
    </div>
    <div class="form-row">
      <label>礼物</label>
      <textarea id="fGifts" placeholder="每行一条，如：&#10;钥匙扣3&#10;冰箱贴2&#10;毛绒挂件"></textarea>
      <div class="hint">每行输入一种礼物及数量</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveEntry()">保存记录</button>
    </div>
  </div>
</div>


<!-- Login Modal -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">🔐</div>
    <div class="login-title">管理员登录</div>
    <div class="login-sub">仅授权用户可进行数据操作</div>
    <div class="login-err" id="loginErr">用户名或密码错误</div>
    <div class="form-row">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-row">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="current-password">

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script>
// ── Auth ─────────────────────────────────────────────────────────────────
const USERS = [
  { username: 'admin', password: 'sm_admin_9988', displayName: '管理员' },
  { username: 'manager', password: 'sm_mgr_2026', displayName: '运营主管' },
];

let currentUser = null;
let pendingAction = null;

try {
  const saved = sessionStorage.getItem('venueUser');
  if (saved) currentUser = JSON.parse(saved);
} catch(e) {}

function isLoggedIn() { return !!currentUser; }

function requireLogin(action) {
  if (isLoggedIn()) {
    if (action) action(); else openModal();
    return;
  }
  pendingAction = action || 'openModal';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginErr').classList.remove('show');
  document.getElementById('loginOverlay').classList.add('open');
  setTimeout(function() { document.getElementById('loginUser').focus(); }, 100);
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const found = USERS.find(function(x) { return x.username === u && x.password === p; });
  if (!found) {
    document.getElementById('loginErr').classList.add('show');
    document.getElementById('loginPass').value = '';
    document.getElementById('loginPass').focus();
    return;
  }
  currentUser = found;
  try { sessionStorage.setItem('venueUser', JSON.stringify(found)); } catch(e) {}
  closeLoginModal();
  updateHeaderAuth();
  toast('欢迎，' + found.displayName + ' ✓');
  if (pendingAction === 'openModal') openModal();
  else if (typeof pendingAction === 'function') pendingAction();
  pendingAction = null;
}

function doLogout() {
  currentUser = null;
  try { sessionStorage.removeItem('venueUser'); } catch(e) {}
  updateHeaderAuth();
  toast('已退出登录');
}

function closeLoginModal() {
  document.getElementById('loginOverlay').classList.remove('open');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('loginOverlay').classList.contains('open')) {
    doLogin();
  }
});

function updateHeaderAuth() {
  const hr = document.getElementById('headerRight');
  if (isLoggedIn()) {
    const initials = currentUser.displayName.slice(0, 1);
    const chip = '<div class="user-chip"><div class="avatar">' + initials + '</div>' + currentUser.displayName + '</div>';
    hr.innerHTML = '<button class="btn btn-export" onclick="exportCSV()">⬇ 导出 CSV</button>' + chip + '<button class="btn-logout" onclick="doLogout()">退出</button>';
  } else {
    hr.innerHTML = '<button class="btn-login-header" onclick="requireLogin(null)">登录</button>';
  }
  const addBtn = document.getElementById('addBtn');
  if (addBtn) {
    if (isLoggedIn()) {
      addBtn.onclick = function() { openModal(); };
      addBtn.style.opacity = '1';
    } else {
      addBtn.onclick = function() { requireLogin(null); };
      addBtn.style.opacity = '0.7';
    }
  }
  if (document.getElementById('tableBody')) renderTable();
}

// ── Data ─────────────────────────────────────────────────────────────────
// ⚠️ 部署后请把下面的 API_URL 替换为你的 Apps Script 网址
const API_URL = 'https://script.google.com/macros/s/AKfycbzhovK0K2jkREGkxHP6WHZgrqaOFZEQxkTL4_UZIYH6qWLj-TMx3tgSfTQUEhikKZIS/exec';

let data = [];
let nextId = 1;
let apiReady = API_URL !== 'YOUR_APPS_SCRIPT_URL_HERE';

// GET：用 JSONP 绕过 CORS
function loadData() {
  setLoading(true);
  if (!apiReady) {
    data = []; nextId = 1;
    renderTable(); setLoading(false);
    toast('请先配置 API_URL 后刷新页面', true);
    return;
  }
  // 清理上次的 JSONP 标签
  const old = document.getElementById('jsonp-script');
  if (old) old.remove();

  window.__jsonpCallback = function(result) {
    if (result && result.records) {
      data = result.records;
      nextId = data.length ? Math.max(...data.map(d => d.id)) + 1 : 1;
    }
    renderTable();
    setLoading(false);
  };

  const s = document.createElement('script');
  s.id = 'jsonp-script';
  s.src = API_URL + '?action=getAll&callback=__jsonpCallback';
  s.onerror = function() {
    setLoading(false);
    toast('数据加载失败，请检查 API 地址', true);
  };
  document.head.appendChild(s);
}

// POST
async function apiPost(body) {
  if (!apiReady) return null;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    const text = await res.text();
    try { return JSON.parse(text); } catch(e) { return { ok: true }; }
  } catch(e) {
    console.error('API error:', e);
    toast('网络请求失败', true);
    return null;
  }
}

function setLoading(on) {
  const tb = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  if (on) {
    tb.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--text3)">⏳ 加载中...</td></tr>';
    if (empty) empty.style.display = 'none';
  }
}
let sortCol = 'date', sortDir = -1;
let currentTab = 'data';
let charts = {};

// ── Helpers ───────────────────────────────────────────────────────────────
function fmtConvert(v) {
  if (v === null || v === undefined || v === '' || isNaN(Number(v))) return '/';
  return (Number(v) * 100).toFixed(2) + '%';
}
function isValidConvert(v) {
  return v !== null && v !== undefined && v !== '' && !isNaN(Number(v));
}

function fmtDate(val) {
  if (!val) return '—';
  // Google Sheets 有时返回 Date 对象或长日期字符串，统一转成 yyyy-mm-dd
  const s = String(val);
  // 已经是 yyyy-mm-dd
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // 尝试解析
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

// ── Colors ────────────────────────────────────────────────────────────────
const TAG_COLORS = [
  { bg: '#EAF0EA', text: '#2d4a2e', border: '#b0c8b1' },
  { bg: '#FAF0E6', text: '#6B3A1F', border: '#e0c4a0' },
  { bg: '#EDF4FB', text: '#1a3d6b', border: '#a8c8ea' },
  { bg: '#FDF8E1', text: '#6B5200', border: '#e0d080' },
  { bg: '#FDEDEB', text: '#7B1F1F', border: '#f0b8b0' },
  { bg: '#F0EDF8', text: '#3d2870', border: '#c0aae0' },
];
const CHART_COLORS = ['#3D5A3E','#8B4513','#2563A8','#B8860B','#C0392B','#6B48C0'];
const colorMap = {};
let colorIdx = 0;
function getColor(p) { if (!colorMap[p]) colorMap[p] = colorIdx++ % TAG_COLORS.length; return colorMap[p]; }

// ── Persist（由各操作函数直接调用 API） ───────────────────────────────────

// ── Filtering ─────────────────────────────────────────────────────────────
function getFiltered() {
  const proj = document.getElementById('filterProject').value;
  const from = document.getElementById('filterDateFrom').value;
  const to   = document.getElementById('filterDateTo').value;
  return data.filter(d => {
    if (proj && d.project !== proj) return false;
    const dt = fmtDate(d.date);
    if (from && dt < from) return false;
    if (to   && dt > to)   return false;
    return true;
  });
}

function clearFilters() {
  document.getElementById('filterProject').value = '';
  document.getElementById('filterDateFrom').value = '';
  document.getElementById('filterDateTo').value = '';
  renderTable();
}

// ── Sorting ───────────────────────────────────────────────────────────────
function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
  ['date','sales','orders','flow'].forEach(c => {
    const el = document.getElementById('sort-' + c);
    if (el) el.textContent = c === col ? (sortDir === -1 ? '↓' : '↑') : '↕';
  });
  renderTable();
}
function sortedFiltered() {
  return getFiltered().sort((a,b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av == null) av = sortDir === -1 ? -Infinity : Infinity;
    if (bv == null) bv = sortDir === -1 ? -Infinity : Infinity;
    return (av < bv ? -1 : av > bv ? 1 : 0) * sortDir;
  });
}

// ── Render Table ──────────────────────────────────────────────────────────
function renderTable() {
  updateFilterOptions();
  const thAction = document.getElementById('thAction');
  if (thAction) thAction.style.display = isLoggedIn() ? '' : 'none';
  const rows = sortedFiltered();
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  document.getElementById('recordCount').textContent = rows.length + ' 条记录';

  if (!rows.length) { tbody.innerHTML = ''; empty.style.display = 'block'; } else {
    empty.style.display = 'none';
    tbody.innerHTML = rows.map(d => {
      const c = TAG_COLORS[getColor(d.project)];
      const gifts = d.gifts ? d.gifts.split('\n').filter(Boolean).join(' · ') : '—';
      const conv = fmtConvert(d.conversion);
      return `<tr>
        <td><span class="tag" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${d.project}</span></td>
        <td class="mono">${fmtDate(d.date)}</td>
        <td class="mono">¥${d.sales.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1})}</td>
        <td class="mono">${d.orders}</td>
        <td class="mono">${d.flow.toLocaleString()}</td>
        <td class="mono">${conv}</td>
        <td style="color:var(--text2);font-size:12px">${d.share ? d.share.split('\n').filter(Boolean).join(' · ') : '—'}</td>
        <td class="gift-text">${gifts}</td>
        ${isLoggedIn() ? `<td style="white-space:nowrap">
          <button class="btn btn-edit" data-id="${d.id}" title="编辑">✎</button>
          <button class="btn btn-danger" data-id="${d.id}" title="删除">✕</button>
        </td>` : ''}
      </tr>`;
    }).join('');
  }
  renderSummary(getFiltered(), data);
  if (currentTab === 'chart') renderCharts();
}

// ── Summary ───────────────────────────────────────────────────────────────
function renderSummary(rows, allData) {
  const totalSales = rows.reduce((s,d) => s + Number(d.sales), 0);
  const totalOrders = rows.reduce((s,d) => s + Number(d.orders), 0);
  const totalFlow = rows.reduce((s,d) => s + Number(d.flow), 0);
  const withConvert = rows.filter(d => isValidConvert(d.conversion));
  const avgConvert = withConvert.length ? ((withConvert.reduce((s,d) => s + Number(d.conversion), 0) / withConvert.length) * 100).toFixed(2) : null;
  const projects = new Set(rows.map(d => d.project)).size;

  const statCards = [
    { icon: '🏛️', label: '项目数量', val: projects, unit: '个' },
    { icon: '💰', label: '总销售额', val: '¥' + totalSales.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1}), unit: '' },
    { icon: '📦', label: '总订单量', val: totalOrders.toLocaleString(), unit: '单' },
    { icon: '👥', label: '总客流量', val: totalFlow.toLocaleString(), unit: '人' },
    { icon: '📈', label: '平均转化率', val: avgConvert ? Number(avgConvert) + '%' : '—', unit: '' },
    { icon: '📅', label: '记录天数', val: rows.length, unit: '天' },
  ].map(s => '<div class="scard"><div class="scard-icon">' + s.icon + '</div><div class="scard-label">' + s.label + '</div><div class="scard-val">' + s.val + '<span class="scard-unit">' + s.unit + '</span></div></div>').join('');

  // 最近一日数据
  // 最近一日：每个项目各自找最近一天，始终用全量 data 不受筛选影响
  let latestBlock = '';
  const allRows = allData || data;
  if (allRows.length > 0) {
    // 取所有项目
    const allProjects = [...new Set(allRows.map(d => d.project))];
    const projectBlocks = allProjects.map(proj => {
      // 该项目所有记录，找最近一天
      const projRows = allRows.filter(d => d.project === proj);
      const projLatestDate = projRows.map(d => fmtDate(d.date)).sort().reverse()[0];
      const d = projRows.find(r => fmtDate(r.date) === projLatestDate);
      if (!d) return '';
      const cv = fmtConvert(d.conversion);
      const col = TAG_COLORS[getColor(d.project)];
      return '<div class="latest-item" style="border-left:3px solid ' + col.border + ';background:' + col.bg + '">'
        + '<div class="latest-item-header" style="color:' + col.text + '">' + d.project + ' - ' + fmtDate(d.date) + '</div>'
        + '<div class="latest-stats">'
        + '<div class="latest-stat"><div class="latest-stat-label">销售额</div><div class="latest-stat-val">¥' + Number(d.sales).toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1}) + '</div></div>'
        + '<div class="latest-stat"><div class="latest-stat-label">订单量</div><div class="latest-stat-val">' + d.orders + '<span class="latest-stat-unit">单</span></div></div>'
        + '<div class="latest-stat"><div class="latest-stat-label">客流量</div><div class="latest-stat-val">' + Number(d.flow).toLocaleString() + '<span class="latest-stat-unit">人</span></div></div>'
        + '<div class="latest-stat"><div class="latest-stat-label">转化率</div><div class="latest-stat-val">' + cv + '</div></div>'
        + '</div>'
        + '</div>';
    }).join('');
    latestBlock = '<div class="latest-card"><div class="latest-title">📍 各项目最近一日数据</div><div class="latest-grid">' + projectBlocks + '</div></div>';
  }

  document.getElementById('summaryCards').innerHTML = '<div class="summary-grid-inner">' + statCards + '</div>' + latestBlock;
}

// ── Filter Options ────────────────────────────────────────────────────────
function updateFilterOptions() {
  const sel = document.getElementById('filterProject');
  const cur = sel.value;
  const projs = [...new Set(data.map(d => d.project))];
  sel.innerHTML = '<option value="">全部项目</option>' + projs.map(p => `<option value="${p}"${p===cur?' selected':''}>${p}</option>`).join('');
  document.getElementById('projectList').innerHTML = projs.map(p => `<option value="${p}">`).join('');
}

// ── Modal ─────────────────────────────────────────────────────────────────
let editingId = null;

function updateConvertPreview() {
  const flow = parseInt(document.getElementById('fFlow').value);
  const orders = parseInt(document.getElementById('fOrders').value);
  const preview = document.getElementById('convertPreview');
  if (!isNaN(flow) && flow > 0 && !isNaN(orders)) {
    const rate = (orders / flow).toFixed(4);
    preview.textContent = (Number(rate) * 100).toFixed(2) + '%';
    preview.style.color = 'var(--accent)';
    preview.style.fontWeight = '500';
  } else {
    preview.textContent = '— 请先填写订单量和客流量';
    preview.style.color = 'var(--text2)';
    preview.style.fontWeight = '400';
  }
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = editingId ? '✎ 编辑数据' : '＋ 添加每日数据';
  document.getElementById('saveBtn').textContent = editingId ? '保存修改' : '保存记录';

  if (editingId) {
    const d = data.find(x => x.id === editingId);
    if (!d) return;
    document.getElementById('fProject').value = d.project;
    document.getElementById('fDate').value = fmtDate(d.date);
    document.getElementById('fFlow').value = d.flow;
    document.getElementById('fSales').value = d.sales;
    document.getElementById('fOrders').value = d.orders;
    document.getElementById('fShare').value = d.share || '';
    document.getElementById('fGifts').value = d.gifts || '';
  } else {
    ['fProject','fFlow','fSales','fOrders','fShare','fGifts'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  }
  updateConvertPreview();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('fFlow').addEventListener('input', updateConvertPreview);
  document.getElementById('fOrders').addEventListener('input', updateConvertPreview);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
  document.getElementById('fFlow').removeEventListener('input', updateConvertPreview);
  document.getElementById('fOrders').removeEventListener('input', updateConvertPreview);
}
function overlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

function saveEntry() {
  const project = document.getElementById('fProject').value.trim();
  const date = document.getElementById('fDate').value;
  const flow = parseInt(document.getElementById('fFlow').value);
  const sales = parseFloat(document.getElementById('fSales').value);
  const orders = parseInt(document.getElementById('fOrders').value);
  const share = document.getElementById('fShare').value.trim();
  const gifts = document.getElementById('fGifts').value.trim();
  if (!project || !date || isNaN(flow) || isNaN(sales) || isNaN(orders)) {
    toast('请填写带 * 的必填项', true); return;
  }
  // 直接用 orders/flow 计算 conversion，不依赖预览框文字
  const conversion = (flow > 0 && orders >= 0) ? parseFloat((orders / flow).toFixed(4)) : null;
  const record = { project, date, sales, orders, flow, conversion, share, gifts };

  // 问题1：新增时检查同项目同日期是否已有记录
  if (!editingId) {
    const dup = data.find(x => x.project === project && fmtDate(x.date) === date);
    if (dup) {
      if (!confirm('【' + project + '】' + date + ' 已有记录，确认用新数据覆盖吗？')) return;
      // 转为覆盖模式
      record.id = dup.id;
      const idx = data.findIndex(x => x.id === dup.id);
      if (idx !== -1) data[idx] = record;
      closeModal();
      renderTable();
      toast('覆盖保存中...');
      apiPost({ action: 'update', record }).then(() => { toast('已覆盖保存 ✓'); setTimeout(loadData, 1500); });
      return;
    }
  }

  if (editingId) {
    record.id = editingId;
    const idx = data.findIndex(x => x.id === editingId);
    if (idx !== -1) data[idx] = record;
    closeModal();
    renderTable();
    toast('保存中...');
    apiPost({ action: 'update', record }).then(() => { toast('修改已保存 ✓'); setTimeout(loadData, 1500); });
  } else {
    record.id = nextId++;
    data.push(record);
    closeModal();
    renderTable();
    toast('保存中...');
    apiPost({ action: 'add', record }).then(() => { toast('数据已保存 ✓'); setTimeout(loadData, 1500); });
  }
}

// ── 事件委托：统一处理编辑和删除 ─────────────────────────────────────────
document.addEventListener('click', function(e) {
  const editBtn = e.target.closest('.btn-edit');
  const delBtn = e.target.closest('.btn-danger');
  if (editBtn) {
    const id = parseInt(editBtn.dataset.id);
    requireLogin(() => openModal(id));
  } else if (delBtn && delBtn.dataset.id) {
    const id = parseInt(delBtn.dataset.id);
    requireLogin(() => {
      if (!confirm('确认删除此条记录？')) return;
      // 本地先删（乐观更新）
      data = data.filter(d => d.id !== id);
      renderTable();
      toast('删除中...');
      apiPost({ action: 'delete', id }).then(() => { toast('已删除 ✓'); setTimeout(loadData, 1500); });
    });
  }
});

// ── Toast ─────────────────────────────────────────────────────────────────
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? '#C0392B' : 'var(--text)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Tabs ──────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', (i===0 && tab==='data') || (i===1 && tab==='chart')));
  document.getElementById('dataSection').classList.toggle('active', tab === 'data');
  document.getElementById('chartSection').classList.toggle('active', tab === 'chart');
  if (tab === 'chart') renderCharts();
}

// ── 2026 法定假期区间 ─────────────────────────────────────────────────────
const HOLIDAYS_2026 = [
  { name: '元旦',   start: '2026-01-01', end: '2026-01-03' },
  { name: '春节',   start: '2026-02-15', end: '2026-02-23' },
  { name: '清明节', start: '2026-04-04', end: '2026-04-06' },
  { name: '劳动节', start: '2026-05-01', end: '2026-05-05' },
  { name: '端午节', start: '2026-06-19', end: '2026-06-21' },
  { name: '中秋节', start: '2026-09-25', end: '2026-09-27' },
  { name: '国庆节', start: '2026-10-01', end: '2026-10-07' },
];

function buildHolidayAnnotations() {
  const annotations = {};
  HOLIDAYS_2026.forEach(function(h, i) {
    // end 加一天，让区间覆盖到假期最后一天结束
    const endDate = new Date(h.end);
    endDate.setDate(endDate.getDate() + 1);
    annotations['holiday_' + i] = {
      type: 'box',
      xMin: h.start,
      xMax: endDate.toISOString().slice(0, 10),
      backgroundColor: 'rgba(184, 134, 11, 0.10)',
      borderColor: 'rgba(184, 134, 11, 0.25)',
      borderWidth: 1,
      label: {
        display: true,
        content: h.name,
        position: { x: 'center', y: 'start' },
        font: { size: 10 },
        color: 'rgba(139, 100, 20, 0.75)',
        padding: 3
      }
    };
  });
  return annotations;
}

// ── Charts ────────────────────────────────────────────────────────────────
function renderCharts() {
  const filtered = getFiltered();
  const projects = [...new Set(filtered.map(d => d.project))];

  function makeDatasets(field) {
    return projects.map((p, i) => {
      const pd = filtered.filter(d => d.project === p).sort((a,b) => a.date.localeCompare(b.date));
      return {
        label: p,
        data: pd.map(d => ({ x: d.date, y: d[field] })),
        borderColor: CHART_COLORS[i % CHART_COLORS.length],
        backgroundColor: CHART_COLORS[i % CHART_COLORS.length] + '22',
        tension: 0.4, pointRadius: 5, pointHoverRadius: 7, fill: false,
        borderDash: i > 0 ? [6,3] : []
      };
    });
  }

  const chartDefs = [
    { id: 'chartSales',   field: 'sales',   fmt: function(v) { return v == null ? '' : '¥' + Number(v).toLocaleString('zh-CN', {minimumFractionDigits:1, maximumFractionDigits:1}); } },
    { id: 'chartFlow',    field: 'flow',    fmt: function(v) { return v == null ? '' : Number(v).toLocaleString(); } },
    { id: 'chartOrders',  field: 'orders',  fmt: function(v) { return v == null ? '' : String(v); } },
    { id: 'chartConvert', field: 'conversion', fmt: function(v) { return v == null || v === '' ? '' : (Number(v) * 100).toFixed(2) + '%'; } },
  ];

  // 注册插件
  if (window.ChartDataLabels) Chart.register(ChartDataLabels);
  if (window.ChartAnnotation) Chart.register(ChartAnnotation);

  const holidayAnnotations = buildHolidayAnnotations();

  chartDefs.forEach(function(def) {
    if (charts[def.id]) { charts[def.id].destroy(); }
    const ctx = document.getElementById(def.id).getContext('2d');
    const fmtFn = def.fmt;
    charts[def.id] = new Chart(ctx, {
      type: 'line',
      data: { datasets: makeDatasets(def.field) },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 24, bottom: 12 } },
        plugins: {
          legend: {
            position: 'bottom',
            labels: { boxWidth: 10, font: { size: 11 }, padding: 20 }
          },
          datalabels: {
            align: function(context) {
              var ds = context.dataset.data;
              var vals = ds.map(function(p) { return p && p.y != null ? Number(p.y) : null; }).filter(function(v) { return v !== null; });
              var maxV = Math.max.apply(null, vals);
              var minV = Math.min.apply(null, vals);
              var cur = context.dataset.data[context.dataIndex];
              var v = cur && cur.y != null ? Number(cur.y) : null;
              return v === maxV ? 'top' : 'bottom';
            },
            anchor: function(context) {
              var ds = context.dataset.data;
              var vals = ds.map(function(p) { return p && p.y != null ? Number(p.y) : null; }).filter(function(v) { return v !== null; });
              var maxV = Math.max.apply(null, vals);
              var cur = context.dataset.data[context.dataIndex];
              var v = cur && cur.y != null ? Number(cur.y) : null;
              return v === maxV ? 'end' : 'start';
            },
            offset: 4,
            font: { size: 10, weight: '600' },
            color: function(context) {
              return CHART_COLORS[context.datasetIndex % CHART_COLORS.length];
            },
            formatter: function(value) {
              if (value == null || value.y == null) return '';
              return fmtFn(value.y);
            },
            display: function(context) {
              var ds = context.dataset.data;
              var vals = ds.map(function(p) { return p && p.y != null ? Number(p.y) : null; }).filter(function(v) { return v !== null; });
              if (vals.length === 0) return false;
              var maxV = Math.max.apply(null, vals);
              var minV = Math.min.apply(null, vals);
              var cur = ds[context.dataIndex];
              var v = cur && cur.y != null ? Number(cur.y) : null;
              if (v === null) return false;
              // 只显示最高和最低，若所有值相同只显示第一个
              if (maxV === minV) return context.dataIndex === 0;
              return v === maxV || v === minV;
            }
          },
          annotation: {
            annotations: holidayAnnotations
          }
        },
        scales: {
          x: { type: 'time', time: { unit: 'day', displayFormats: { day: 'MM-dd' } },
            ticks: { font: { size: 11 }, color: '#9E9688', maxRotation: 0, padding: 16 },
            grid: { color: 'rgba(0,0,0,0.05)' },
            min: (function() {
              var allDates = filtered.map(function(d) { return fmtDate(d.date); }).filter(Boolean).sort();
              return allDates.length ? allDates[0] : undefined;
            })(),
            max: (function() {
              var allDates = filtered.map(function(d) { return fmtDate(d.date); }).filter(Boolean).sort();
              return allDates.length ? allDates[allDates.length - 1] : undefined;
            })()
          },
          y: { beginAtZero: true,
            ticks: { font: { size: 11 }, color: '#9E9688' },
            grid: { color: 'rgba(0,0,0,0.05)' } }
        }
      }
    });
  });
}

// ── Export CSV ────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = getFiltered().sort((a,b) => b.date.localeCompare(a.date));
  const cols = ['项目','日期','销售额(元)','订单量','客流量','转化率(%)','分享文章数','礼物'];
  const lines = [cols.join(','), ...rows.map(d =>
    [d.project, d.date, d.sales, d.orders, d.flow,
     d.conversion != null ? d.conversion : '',
     d.share || '',
     (d.gifts || '').replace(/\n/g,' | ')
    ].map(v => `"${v}"`).join(',')
  )];
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '场馆运营数据_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); toast('CSV 已导出 ✓');
}

// ── Chart.js time adapter ─────────────────────────────────────────────────
// Load time adapter for x-axis date parsing
const adapterScript = document.createElement('script');
adapterScript.src = 'https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js';
document.head.appendChild(adapterScript);

// ── Init ──────────────────────────────────────────────────────────────────
updateHeaderAuth();
loadData();
</script>
